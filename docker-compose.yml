version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: timetable-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: timetable_db
      MYSQL_USER: timetable_user
      MYSQL_PASSWORD: timetable_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "timetable_user", "-ptimetable_password"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timetable-app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://timetable_user:timetable_password@mysql:3306/timetable_db
      SESSION_SECRET: super-secret-session-key-change-in-production-32-chars-long
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  mysql_data:
